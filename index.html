<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN | Переход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1225 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: rgba(18, 25, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 32px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(59,130,246,0.3);
        }

        .icon {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .sub {
            color: #8aa3d9;
            margin-bottom: 32px;
            font-size: 1rem;
        }

        /* КНОПКА VPN */
        .vpn-btn {
            background: linear-gradient(95deg, #2563eb, #1e40af);
            border: none;
            padding: 18px 40px;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            margin: 0 auto 24px;
            display: block;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
            font-family: inherit;
            letter-spacing: 1px;
        }

        .vpn-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #3b82f6, #2563eb);
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.5);
        }

        .vpn-btn:active {
            transform: scale(0.98);
        }

        .info {
            color: #6b7fb1;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .badge {
            display: inline-block;
            background: #1e2a4f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #90cdf4;
        }

        footer {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #4a5a82;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 11V7C7 4.23858 9.23858 2 12 2C14.7614 2 17 4.23858 17 7V11M12 14V16M5 11H19C20.1046 11 21 11.8954 21 13V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V13C3 11.8954 3.89543 11 5 11Z" stroke="#3b82f6" stroke-width="1.5" fill="rgba(59,130,246,0.1)"/>
                    <circle cx="12" cy="17" r="1.5" fill="#3b82f6"/>
                </svg>
            </div>
            <h1>VPN Connect</h1>
            <div class="sub">Безопасное соединение</div>
            
            <!-- КНОПКА VPN - при нажатии сразу переходит по ссылке -->
            <button class="vpn-btn" id="vpnButton">🔐 VPN</button>
            
            <div class="info">
                <span class="badge">⚡ Защищённый туннель</span>
                <span class="badge">🛡️ Без логов</span>
                <div style="margin-top: 10px;">Нажмите для перехода на VPN-ресурс</div>
            </div>
        </div>
        <footer>
            🔒 AES-256 шифрование • Kill switch • Zero logs
        </footer>
    </div>

    <script>
        // Целевая ссылка (точная по заданию)
        const TARGET_URL = "https://gist.github.com/TimofeyMolodoy/4cb5d7fcb04daf6f4debec9a3b042d83";
        
        // Получаем кнопку
        const vpnButton = document.getElementById('vpnButton');
        
        // Назначаем обработчик клика - ПРЯМОЙ ПЕРЕХОД
        vpnButton.addEventListener('click', function() {
            // Переход на сайт (текущая вкладка)
            window.location.href = TARGET_URL;
        });
    </script>
</body>
</html>
